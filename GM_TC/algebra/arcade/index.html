:root {

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --c1: #5f8ef0; --c2: #d0782c; --c3: #b46ae0;
  --screen: #1a1b26; --screen-line: #3b4261; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #1a1b26; --panel: #1f2335; --raised: #24283b; --line: #3b4261; --grid: #2a2f45;
  --fg: #c0caf5; --fg-2: #a9b1d6; --muted: #8a93bd;

.btn-primary:hover { filter: brightness(1.08); }

/* Shell */
.shell { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 28px; max-width: 1320px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 60px; }

.seg-btn:last-child { border-right: 0; }
.seg-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg-btn small { font-size: 0.62rem; opacity: .75; font-variant-numeric: tabular-nums; }
.range { display: flex; gap: 8px; align-items: center; font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }
.range select { flex: 1; min-width: 0; font-family: var(--mono); font-size: 0.78rem; padding: 5px 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.count { font-family: var(--mono); font-size: 0.76rem; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.set { border-top: 1px solid var(--line); padding-block: 8px; }

.set-t { font-family: var(--display); font-weight: 700; font-size: 0.98rem; line-height: 1.25; }

.qlink:hover { background: var(--raised); color: var(--fg); }

.qlink .qm { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }

/* Main column */
.main { min-width: 0; max-width: 820px; }
.crumbs { font-family: var(--mono); font-size: 0.76rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.badge { font-family: var(--mono); font-size: 0.7rem; padding: 2px 8px; border-radius: 999px; background: var(--raised); color: var(--fg-2); display: inline-flex; align-items: center; gap: 6px; }
.badge.anim { background: var(--accent-soft); color: var(--fg); }

.q-title span { color: var(--muted); font-weight: 500; }

.topics { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }

/* Steps */
.steps-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 26px 0 10px; flex-wrap: wrap; }

.mark.ok { background: var(--good-soft); color: var(--good); } .mark.miss { background: var(--warn-soft); color: var(--warn); } .mark.shown { background: var(--raised); color: var(--muted); }

.opts.abc.long { grid-template-columns: minmax(0, 1fr); }
.opt { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px 12px; cursor: pointer; font-family: var(--serif); font-size: 0.98rem; line-height: 1.45; min-width: 0; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt .kbd { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-top: 3px; }
.opts.abc .opt .kbd { color: var(--c3); border-color: var(--c3); font-weight: 600; }
.opt > span:last-child { min-width: 0; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.dim { opacity: .55; }
.num-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.num-row input { font-family: var(--mono); font-size: 0.95rem; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); width: min(240px, 100%); }
.hintline { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); margin-top: 6px; }

.fb.good { background: var(--good-soft); } .fb.bad { background: var(--bad-soft); } .fb.info { background: var(--raised); }
.fb-k { font-family: var(--mono); font-size: 0.72rem; font-weight: 600; display: block; margin-bottom: 2px; }
.fb.good .fb-k { color: var(--good); } .fb.bad .fb-k { color: var(--bad); } .fb.info .fb-k { color: var(--muted); }

.screen { margin-top: 12px; background: var(--screen); border: 1px solid var(--screen-line); border-radius: var(--r); overflow: hidden; }

.sel-list { display: grid; gap: 8px; margin: 14px 0; padding: 0; list-style: none; counter-reset: s; }

.sel-tools .btn { padding: 4px 8px; }

  .hud-row { gap: 10px; }
  .tape-wrap { display: none; }
}
.map-close { display: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  const freshF = () => ({ topics: [], diffs: [], from: YEARS[0], to: YEARS[YEARS.length - 1], anim: false, open: false, sel: false, q: '', group: 'topic' });

  /* ---------- persistence ---------- */

    const p = QIDX.get(ui.qid), st = qs(p.id), host = $('#steps');
    const n = p.steps.length;
    const dots = p.steps.map((_, i) => `<span class="dot ${st.r[i] || ''} ${i === st.cur && !st.done ? 'cur' : ''}" title="Trin ${i + 1}"></span>`).join('');
    let html = `<div class="steps-head"><h3>${n > 1 ? `Løs den i ${n} trin` : 'Vælg svaret'}</h3>${n > 1 ? `<div class="dots" aria-label="Fremskridt">${dots}</div>` : ''}</div>`;
    p.steps.forEach((sp, i) => {
      const justDone = ui.reveal && ui.reveal.qid === p.id && ui.reveal.i === i;
      if (i < st.cur && !justDone) {
        const r = st.r[i] || 'ok', lab = { ok: 'første forsøg', miss: 'efter en fejl', shown: 'vist' }[r];
        html += `<div class="done-step"><span class="mark ${r}">${lab}</span><div><div class="pr">${sp.k === 'abc' ? 'Svar' : sp.p}</div><div class="ans">→ ${stepAnswerHTML(p, sp)}</div></div>${sp.why ? `<details><summary>hvorfor</summary>${sp.why}</details>` : ''}</div>`;
      }
    });
    const i = ui.reveal && ui.reveal.qid === p.id ? ui.reveal.i : st.cur;
    if (i < n && !(st.done && !ui.reveal)) html += stepCard(p, p.steps[i], i, 'q');
    setHTML(host, html);
    const inp = host.querySelector('input[data-num]'); if (inp && !ui.reveal) inp.focus({ preventScroll: true });
  }

  function stepCard(p, sp, i, mode, extra = {}) {
    const key = `${p.id}#${i}${mode === 'review' ? '#r' : ''}`;
    const solved = mode === 'q' ? !!(ui.reveal && ui.reveal.qid === p.id && ui.reveal.i === i) : !!extra.solved;
    if (mode === 'q' && solved) extra = { shown: ui.reveal.shown, xp: ui.reveal.xp };
    const wrong = ui.wrong[key] || new Set();
    const n = p.steps.length;
    const title = mode === 'review' ? `Gentag · ${p.season} opg. ${p.nr}, trin ${i + 1}` : sp.k === 'abc' ? (n > 1 ? `Trin ${i + 1} af ${n} · slutsvar` : 'Svar') : `Trin ${i + 1} af ${n}`;
    const prompt = sp.k === 'abc' ? (n > 1 ? 'Nu kan du vælge svaret på opgaven.' : '') : sp.p;
    let body = '';
    if (sp.k === 'abc') {
      const right = LETTERS.indexOf(p.ans);
      const long = p.opts.some(o => strip(o).length > 34);
      body = `<div class="opts abc ${long ? 'long' : ''}" role="group" aria-label="Svarmuligheder">${p.opts.map((o, oi) => {
        const cls = solved ? (oi === right ? 'right' : 'dim') : wrong.has(oi) ? 'wrong' : '';
        return `<button class="opt ${cls}" type="button" data-pick="${oi}" data-key="${key}" ${solved || wrong.has(oi) ? 'disabled' : ''}><span class="kbd">${LETTERS[oi]}</span><span>${o}</span></button>`;
      }).join('')}</div>`;
    } else if (sp.k === 'mcq') {
      const ord = order(sp.o.length, key.replace('#r', ''));
      body = `<div class="opts" role="group" aria-label="Svarmuligheder">${ord.map((oi, k) => {
        const cls = solved ? (oi === 0 ? 'right' : 'dim') : wrong.has(oi) ? 'wrong' : '';
        return `<button class="opt ${cls}" type="button" data-pick="${oi}" data-key="${key}" ${solved || wrong.has(oi) ? 'disabled' : ''}><span class="kbd">${k + 1}</span><span>${sp.o[oi]}</span></button>`;
      }).join('')}</div>`;
    } else {
      body = solved ? `<div class="fb info"><span class="fb-k">Facit</span>\\(${fmtA(sp.a)}\\)</div>` : `<div class="num-row"><input data-num="${key}" id="in-${key.replace(/[^a-z0-9]/gi, '-')}" inputmode="decimal" autocomplete="off" aria-label="Dit svar"><button class="btn btn-primary" type="button" data-check="${key}">Tjek</button></div><div class="hintline">Tal eller udtryk: 3, -49, 0,5, 1/4, sqrt(2), 2^9</div>`;
    }
    const msg = ui.numMsg[key];
    let fb = '';
    if (solved) {
      const lead = sp.k === 'abc' ? `${extra.shown ? 'Svaret er' : 'Rigtigt:'} ${p.ans}` : (extra.shown ? 'Svaret er vist' : 'Rigtigt');
      fb = `<div class="fb good"><span class="fb-k">${lead}${extra.xp ? ` · +${extra.xp} XP` : ''}</span>${sp.k === 'abc' ? '' : (sp.why || '')}</div>`;
      if (mode === 'q') fb += clipHTML(p, i, true);
    } else if (msg) fb = `<div class="fb bad"><span class="fb-k">Ikke helt</span>${msg}</div>`;
    else if (wrong.size && sp.k === 'abc') fb = `<div class="fb bad"><span class="fb-k">Ikke ${[...wrong].map(o => LETTERS[o]).join(' eller ')}</span>Prøv igen, eller tag et hint.</div>`;
    const showHint = ui.hint[p.id] && p.hint && mode === 'q' && !solved;
    if (showHint) fb += `<div class="fb info"><span class="fb-k">Hint</span>${p.hint}</div>`;
    const isLast = i + 1 >= n;
    const actions = solved
      ? `<button class="btn btn-primary" type="button" data-next="${key}">${mode === 'q' && isLast ? 'Se løsningen' : 'Fortsæt'}</button>`
      : `${p.hint && mode === 'q' && !ui.hint[p.id] ? `<button class="btn" type="button" data-hint="${p.id}">Vis hint</button>` : ''}<button class="btn btn-quiet" type="button" data-show="${key}">Vis svaret</button>`;
    const ask = sampleReady ? `<button class="btn btn-quiet" type="button" data-ask="${key}">Spørg Claude</button>` : '';
    const askOut = ui.ask[key] ? `<div class="claude"><span class="claude-k">Claude</span><div class="claude-out ${ui.ask[key].done ? 'fmt' : ''}" data-askout="${key}">${ui.ask[key].html}</div></div>` : '';
    return `<div class="step active" data-stepkey="${key}"><span class="step-k">${title}</span>${prompt ? `<div class="step-p">${prompt}</div>` : ''}${body}${fb}<div class="step-actions">${actions}${ask}</div>${askOut}</div>`;
  }

  function playerHTML(p) {
    const clips = MEDIA[p.id]; if (!clips) return '';
    const total = clips.reduce((a, c) => a + c.dur, 0);
    return `<div class="player" id="player" data-q="${p.id}" data-i="0"><span class="k" style="font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)">Hele gennemgangen · ${clips.length} klip · ${Math.round(total)} s</span>
      <div class="screen"><video id="pv" src="${clips[0].src}" muted playsinline controls preload="metadata"></video>
      <div class="screen-cap"><span id="pvCap">Klip 1/${clips.length} · ${esc(clips[0].label)}</span><span>afspiller klippene i rækkefølge</span></div></div>
      <div class="chapters">${clips.map((c, i) => `<button class="btn" type="button" data-chap="${i}" aria-pressed="${i === 0}">${i + 1} · ${esc(c.label)} <small>${c.dur.toFixed(0)} s</small></button>`).join('')}</div></div>`;
  }
  function playChapter(i, autoplay) {
    const box = $('#player'); if (!box) return; const clips = MEDIA[box.dataset.q]; if (!clips || !clips[i]) return;
    box.dataset.i = i; const v = $('#pv'); v.src = clips[i].src;
    $('#pvCap').textContent = `Klip ${i + 1}/${clips.length} · ${clips[i].label}`;
    box.querySelectorAll('[data-chap]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.chap === i));
    if (autoplay) v.play().catch(() => {});
  }
  function renderFinish() {
    const p = QIDX.get(ui.qid), st = qs(p.id), host = $('#finish');
    if (!st.done || (ui.reveal && ui.reveal.qid === p.id)) { setHTML(host, ''); return; }
    const { next } = neighbours(p.id);
    setHTML(host, `<div class="finish">
      <h3>Opgave ${p.nr} · ${p.season} er løst</h3>${starsHTML(st.stars, 'big-stars')}
      <div class="sol"><span class="k">Svar ${p.ans} · officiel løsning (oversat)</span><div>${p.sol}</div></div>
      ${playerHTML(p)}
      <div class="step-actions" style="margin-top:16px">${next ? `<button class="btn btn-primary" type="button" data-open="${next}">Næste: ${QIDX.get(next).season} opg. ${QIDX.get(next).nr}</button>` : '<span>Det var den sidste opgave i filtret.</span>'}<button class="btn btn-quiet" type="button" data-replay="${p.id}">Løs den igen</button><button class="btn btn-quiet" type="button" data-star="${p.id}" aria-pressed="${isSel(p.id)}">${isSel(p.id) ? '★ Udvalgt' : '☆ Vælg til sæt'}</button></div>
    </div>`);
    const v = $('#pv');
    if (v) v.addEventListener('ended', () => { const i = +$('#player').dataset.i; if (i + 1 < MEDIA[p.id].length) playChapter(i + 1, true); });
  }

  /* ---------- answering ---------- */
  function locate(key) {
    const [qid, i, tag] = key.split('#'); const p = QIDX.get(qid);
    return { p, i: +i, sp: p.steps[+i], mode: tag === 'r' ? 'review' : 'q' };
  }
  function correct(key, shown) {
    const { p, i, mode } = locate(key);
    if (mode === 'review') {
      const first = !(ui.wrong[key] && ui.wrong[key].size) && !ui.numMsg[key + '!'] && !shown;
      ui.revSolved = { key, shown, xp: first ? award(5) : 0 };
      const item = `${p.id}#${i}`;
      S.review = S.review.filter(k => k !== item);
      if (!first) S.review.push(item);
      pushTape(first); persist(); renderHud(); renderReview(); return;
    }
    const st = qs(p.id), isNew = st.r[i] === undefined, first = isNew && !shown;
    if (isNew) st.r[i] = shown ? 'shown' : 'ok';
    let xp = 0;
    if (first) { S.streak++; S.best = Math.max(S.best, S.streak); xp = award(Math.round(10 * (1 + 0.1 * Math.min(S.streak, 10)))); }
    else if (!shown) xp = award(3);
    if (shown) S.streak = 0;
    if (!first && !S.review.includes(`${p.id}#${i}`)) S.review.push(`${p.id}#${i}`);
    pushTape(first);
    st.cur = Math.max(st.cur, i + 1);
    if (st.cur >= p.steps.length && !st.done) {
      st.done = true;
      const okN = p.steps.filter((_, k) => st.r[k] === 'ok').length, ratio = okN / p.steps.length;
      let stars = ratio === 1 ? 3 : ratio >= 0.6 ? 2 : 1;
      if (st.hint) stars = Math.min(stars, 2);
      st.stars = Math.max(st.best || 0, stars);
      award(10 + 2 * p.diff + (st.stars === 3 ? 10 : 0));
    }
    ui.reveal = { qid: p.id, i, xp, shown };
    say(shown ? 'Svaret er vist' : 'Rigtigt');
    persist(); renderHud(); renderMap(); renderSteps();
    $('#steps .step.active [data-next]')?.focus({ preventScroll: true });
  }
  function miss(key) {
    const { p, i, mode } = locate(key);
    if (mode === 'q') {
      const st = qs(p.id);
      if (st.r[i] === undefined) { st.r[i] = 'miss'; S.streak = 0; pushTape(false); if (!S.review.includes(`${p.id}#${i}`)) S.review.push(`${p.id}#${i}`); persist(); renderHud(); }
    } else { ui.numMsg[key + '!'] = 1; pushTape(false); }
    say('Ikke helt');
  }
  function pick(key, oi) {
    const { p, sp, mode } = locate(key);
    const right = sp.k === 'abc' ? LETTERS.indexOf(p.ans) : 0;
    if (oi === right) return correct(key, false);
    (ui.wrong[key] = ui.wrong[key] || new Set()).add(oi); miss(key);
    rerender(mode);
  }
  function check(key) {
    const { sp, mode } = locate(key);
    const inp = document.querySelector(`[data-num="${CSS.escape(key)}"]`), x = parseNum(inp.value);
    if (!Number.isFinite(x)) { ui.numMsg[key] = 'Det kan ikke læses som et tal. Prøv fx 3, -49, 0,5 eller 1/4.'; rerender(mode, inp.value); return; }
    if (close(x, sp)) { delete ui.numMsg[key]; return correct(key, false); }
    ui.numMsg[key] = `\\(${fmtA(x)}\\) er ikke rigtigt. Regn efter, eller tryk Vis svaret.`; miss(key);
    rerender(mode, inp.value);
  }
  function rerender(mode, keepVal) {
    if (mode === 'review') return renderReview(keepVal);
    renderSteps();
    if (keepVal !== undefined) { const inp = $('#steps input[data-num]'); if (inp) { inp.value = keepVal; inp.select(); } }
  }
  function nextStep(key) {
    const { mode } = locate(key);
    if (mode === 'review') { [key, key + '!'].forEach(k => { delete ui.numMsg[k]; }); delete ui.wrong[key]; delete ui.ask[key]; ui.revSolved = null; renderReview(); return; }
    ui.reveal = null; renderSteps(); renderFinish();
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (qs(ui.qid).done) $('#finish').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
    else $('#steps .step.active')?.scrollIntoView({ block: 'nearest' });
  }

  /* ---------- review ---------- */
  function openReview() { ui.view = 'review'; ui.revSolved = null; renderAll(); window.scrollTo({ top: 0 }); if (innerWidth <= 980) $('#map').hidden = true; }
  function renderReview(keepVal) {
    const main = $('#main');
    if (!S.review.length && !ui.revSolved) {
      setHTML(main, `<h2 class="q-title">Gentag</h2><p class="empty">Intet at gentage. Trin, du svarer forkert på eller får vist, havner her, så du kan prøve dem igen uden resten af opgaven.</p>${S.last ? `<div class="step-actions"><button class="btn btn-primary" type="button" data-open="${S.last}">Tilbage til opgaven</button></div>` : ''}`);
      return;
    }
    const k = ui.revSolved ? ui.revSolved.key.replace('#r', '') : S.review[0];
    const [qid, i] = k.split('#'); const p = QIDX.get(qid), sp = p.steps[+i];
    const solved = !!ui.revSolved;
    setHTML(main, `<h2 class="q-title">Gentag</h2><p class="crumbs">${S.review.length} trin i køen. Svar rigtigt i første forsøg for at fjerne et trin.</p>
      <div class="q-text" style="margin:12px 0"><span class="badge">${p.season} · opg. ${p.nr}</span> ${p.text}</div>
      ${stepCard(p, sp, +i, 'review', { solved, shown: solved && ui.revSolved.shown, xp: solved && ui.revSolved.xp })}
      <div class="step-actions"><button class="btn btn-quiet" type="button" data-open="${p.id}">Åbn hele opgaven</button>${S.review.length > 1 && !solved ? '<button class="btn btn-quiet" type="button" id="skipRev">Spring over</button>' : ''}</div>`);
    if (keepVal !== undefined) { const inp = main.querySelector('input[data-num]'); if (inp) { inp.value = keepVal; inp.select(); } }
  }

  /* ---------- udvalgte + LaTeX ---------- */
  function toggleSel(id) {
    S.sel = isSel(id) ? S.sel.filter(x => x !== id) : [...S.sel, id];
    persist(); renderHud(); renderMap(true);
    document.querySelectorAll(`[data-star="${CSS.escape(id)}"]`).forEach(b => {
      b.setAttribute('aria-pressed', isSel(id));
      if (b.classList.contains('btn')) b.textContent = isSel(id) ? '★ Udvalgt' : '☆ Vælg til sæt';
    });
    if (ui.view === 'sel') renderSel();
  }
  function toLatex(s) {
    return String(s).split(/(\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\])/).map(part => {
      if (part.startsWith('\\(')) return '$' + part.slice(2, -2).replace(/\\lt\b/g, '<').replace(/\\gt\b/g, '>') + '$';
      if (part.startsWith('\\[')) return part.replace(/\\lt\b/g, '<').replace(/\\gt\b/g, '>');
      return part.replace(/(\d)\s?%/g, '$1\\,\\%').replace(/%/g, '\\%');
    }).join('');
  }
  function exportTex(ids) {
    return ids.map(id => {
      const p = QIDX.get(id);
      return `% Abel ${p.season}, opgave ${p.nr} · ${p.topics.map(t => TNAME[t]).join(', ')} · sværhed ${p.diff}/5\n\\begin{opg}\n\\label{opg:abel-${p.id}}\n${toLatex(p.text)}\n\n\\noindent${p.opts.map((o, i) => `\\textbf{${LETTERS[i]}} ${toLatex(o)}`).join('\\quad\n')}\n\\end{opg}\n\n\\vspace{5mm}\n`;
    }).join('\n');
  }
  function exportKey(ids) { return `\\begin{multicols}{4}\n\\noindent\n${ids.map((id, k) => `Opgave ${k + 1}: ${QIDX.get(id).ans}\\\\`).join('\n')}\n\\end{multicols}\n`; }
  function exportList(ids) { return ids.map((id, k) => { const p = QIDX.get(id); return `${k + 1}. Abel ${p.season} opg. ${p.nr} (svar ${p.ans}, ${TNAME[p.topics[0]]}, sværhed ${p.diff})`; }).join('\n'); }
  function openSel() { ui.view = 'sel'; renderAll(); window.scrollTo({ top: 0 }); if (innerWidth <= 980) $('#map').hidden = true; }
  function renderSel() {
    const main = $('#main'), ids = S.sel.filter(id => QIDX.has(id));
    if (!ids.length) {
      setHTML(main, `<h2 class="q-title">Udvalgte opgaver</h2><p class="empty">Ingen opgaver er valgt endnu. Tryk på ★ ved en opgave i listen, eller på “Vælg til sæt” på en opgave, for at bygge et opgavesæt. Her kan du derefter ordne dem og kopiere dem som LaTeX.</p>`);
      return;
    }
    const tex = exportTex(ids), key = exportKey(ids), list = exportList(ids);
    setHTML(main, `<h2 class="q-title">Udvalgte opgaver <span>· ${ids.length}</span></h2>
      <div class="step-actions"><button class="btn" type="button" id="selSortDiff">Sortér efter sværhed</button><button class="btn" type="button" id="selSortYear">Sortér efter år</button><button class="btn btn-quiet" type="button" id="selClear">Fjern alle</button></div>
      <ol class="sel-list">${ids.map((id, k) => { const p = QIDX.get(id); return `<li class="sel-item"><div style="min-width:0"><div class="meta"><span>${p.season} · opg. ${p.nr}</span>${diffHTML(p.diff)}<span>svar ${p.ans}</span><span>${esc(TNAME[p.topics[0]])}</span></div><div class="txt">${p.text}</div></div>
        <div class="sel-tools"><button class="btn" type="button" data-mv="${id}" data-d="-1" ${k === 0 ? 'disabled' : ''} aria-label="Flyt op">↑</button><button class="btn" type="button" data-mv="${id}" data-d="1" ${k === ids.length - 1 ? 'disabled' : ''} aria-label="Flyt ned">↓</button><button class="btn" type="button" data-open="${id}">Åbn</button><button class="btn btn-quiet" type="button" data-star="${id}" aria-label="Fjern">✕</button></div></li>`; }).join('')}</ol>
      <div class="sol"><span class="k">Eksport</span>LaTeX i samme <code>opg</code>-stil som <code>abelkonkurransen_geometri.tex</code> (kræver <code>amsmath</code> og, for facit, <code>multicol</code>).</div>
      <div class="step-actions"><button class="btn btn-primary" type="button" data-copy="tex">Kopiér opgaver som LaTeX</button><button class="btn" type="button" data-copy="key">Kopiér facit</button><button class="btn" type="button" data-copy="list">Kopiér som liste</button><span class="chip" id="copyMsg" aria-live="polite">${esc(ui.copied)}</span></div>
      <textarea class="export" id="exportBox" readonly aria-label="LaTeX-eksport">${esc(tex)}</textarea>`);
    main.dataset.tex = tex; main.dataset.key = key; main.dataset.list = list;
  }
  async function copy(kind) {
    const main = $('#main'), txt = main.dataset[kind] || '', box = $('#exportBox');
    box.value = txt;
    const label = { tex: 'Opgaverne', key: 'Facit', list: 'Listen' }[kind];
    try { await navigator.clipboard.writeText(txt); ui.copied = `${label} er kopieret.`; }
    catch (e) { box.focus(); box.select(); ui.copied = `Kopiering blev afvist: teksten er markeret, tryk Ctrl+C / ⌘C.`; }
    $('#copyMsg').textContent = ui.copied;
  }

  /* ---------- Claude ---------- */
  let sample = null, sampleReady = false;
  function formatClaude(text) { return esc(text).split(/\n{2,}/).map(p => `<p>${p.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>')}</p>`).join(''); }
  function ctxFor(p) {
    return `Konkurrence: Abelkonkurrencen (norsk), runde 1, multiple choice A–E, for gymnasieelever. Opgaven er oversat til dansk og bruges til træning af danske Georg Mohr-deltagere.\nSæson ${p.year}/${p.year + 1}, opgave ${p.nr} (sværhed ${p.diff}/5). Delemne: ${p.topics.map(t => TNAME[t]).join(', ')}.\nOpgave: ${strip(p.text)}\nSvarmuligheder: ${p.opts.map((o, i) => LETTERS[i] + ') ' + strip(o)).join('  ')}\nRigtigt svar: ${p.ans}\nOfficiel løsning: ${strip(p.sol)}`;
  }
  async function askStep(key) {
    if (!sample) return;
    const { p, sp } = locate(key);
    const right = sp.k === 'abc' ? LETTERS.indexOf(p.ans) : 0;
    const opts = sp.k === 'abc' ? p.opts : sp.o || [];
    const wrong = [...(ui.wrong[key] || [])].map(oi => strip(opts[oi] || ''));
    const stepTxt = sp.k === 'abc' ? 'Eleven skal vælge det rigtige svar A–E.' : `Eleven arbejder på dette trin: ${strip(sp.p)}\n${sp.k === 'mcq' ? `Muligheder: ${sp.o.map(strip).join(' | ')}\nRigtig mulighed: ${strip(sp.o[0])}` : `Rigtigt tal: ${sp.a}`}\nKort forklaring: ${strip(sp.why || '')}`;
    const prompt = `${ctxFor(p)}\n\n${stepTxt}\n${wrong.length ? `Eleven har fejlagtigt valgt: ${wrong.join(' | ')}` : 'Eleven har ikke svaret forkert endnu.'}\n\nForklar på dansk, med højst 150 ord, ${wrong.length ? 'hvad der er galt med det eleven valgte, og ' : ''}hvordan man kommer videre. Afslør ikke svarbogstavet, medmindre eleven allerede har svaret forkert to gange. Skriv matematik i LaTeX med \\( \\) inline og \\[ \\] for display. Almindelige afsnit, ingen overskrifter.`;
    ui.ask[key] = { html: 'Tænker…', done: false };
    rerenderAsk(key);
    try {
      const { text } = await sample(prompt, { onText: ({ text }) => { ui.ask[key].html = esc(text); const o = document.querySelector(`[data-askout="${CSS.escape(key)}"]`); if (o) o.textContent = text; } });
      ui.ask[key] = { html: formatClaude(text), done: true };
    } catch (e) {
      ui.ask[key] = { html: e && e.text ? formatClaude(e.text) : askError(e), done: true };
      if (e && ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled'].includes(e.code)) sampleReady = false;
    }
    rerenderAsk(key);
  }
  function askError(e) { const c = e && e.code; if (c === 'rate_limited') return 'For mange forespørgsler lige nu. Prøv igen om et minut.'; if (c === 'not_granted' || c === 'sampling_disabled') return 'Claude er ikke tilgængelig på denne side for din konto.'; if (c === 'cancelled') return 'Stoppet.'; return 'Claude svarede ikke. Prøv igen.'; }
  function rerenderAsk(key) {
    const box = document.querySelector(`[data-stepkey="${CSS.escape(key)}"]`); if (!box) return;
    let out = box.querySelector('.claude');
    if (!out) { out = document.createElement('div'); out.className = 'claude'; out.innerHTML = '<span class="claude-k">Claude</span><div class="claude-out"></div>'; box.append(out); }
    const o = out.querySelector('.claude-out'); o.setAttribute('data-askout', key); o.classList.toggle('fmt', ui.ask[key].done);
    window.FMClear(o); o.innerHTML = ui.ask[key].html; if (ui.ask[key].done) window.FMTypeset(o);
  }

  /* ---------- events ---------- */
  document.addEventListener('click', ev => {
    const t = ev.target.closest('button'); if (!t) return;
    if (t.dataset.q) return openQ(t.dataset.q);
    if (t.dataset.open) return openQ(t.dataset.open);
    if (t.dataset.star) return toggleSel(t.dataset.star);
    if (t.dataset.pick !== undefined) return pick(t.dataset.key, +t.dataset.pick);
    if (t.dataset.check) return check(t.dataset.check);
    if (t.dataset.show) { const key = t.dataset.show, { mode } = locate(key); if (mode === 'review') ui.numMsg[key + '!'] = 1; delete ui.numMsg[key]; return correct(key, true); }
    if (t.dataset.next) return nextStep(t.dataset.next);
    if (t.dataset.hint) { ui.hint[t.dataset.hint] = true; qs(t.dataset.hint).hint = true; persist(); return renderSteps(); }
    if (t.dataset.ask) return askStep(t.dataset.ask);
    if (t.dataset.chap !== undefined) return playChapter(+t.dataset.chap, true);
    if (t.dataset.replay) { const id = t.dataset.replay; S.q[id] = { r: {}, cur: 0, done: false, stars: 0, best: (S.q[id] || {}).stars || 0 }; Object.keys(ui.wrong).forEach(k => k.startsWith(id + '#') && delete ui.wrong[k]); Object.keys(ui.numMsg).forEach(k => k.startsWith(id + '#') && delete ui.numMsg[k]); delete ui.hint[id]; ui.reveal = null; persist(); return renderAll(true); }
    if (t.dataset.ftopic) return setFilter(f => { f.topics = f.topics.includes(t.dataset.ftopic) ? f.topics.filter(x => x !== t.dataset.ftopic) : [...f.topics, t.dataset.ftopic]; });
    if (t.dataset.fdiff) return setFilter(f => { const d = +t.dataset.fdiff; f.diffs = f.diffs.includes(d) ? f.diffs.filter(x => x !== d) : [...f.diffs, d].sort(); });
    if (t.dataset.fgroup) return setFilter(f => { f.group = t.dataset.fgroup; });
    if (t.dataset.mv) { const i = S.sel.indexOf(t.dataset.mv), j = i + +t.dataset.d; if (i >= 0 && j >= 0 && j < S.sel.length) { [S.sel[i], S.sel[j]] = [S.sel[j], S.sel[i]]; persist(); renderSel(); renderMap(true); } return; }
    if (t.dataset.copy) return copy(t.dataset.copy);
    switch (t.id) {
      case 'fTopicsClear': return setFilter(f => { f.topics = []; });
      case 'fDiffClear': return setFilter(f => { f.diffs = []; });
      case 'fAnim': return setFilter(f => { f.anim = !f.anim; });
      case 'fOpen': return setFilter(f => { f.open = !f.open; });
      case 'fSel': return setFilter(f => { f.sel = !f.sel; });
      case 'reviewBtn': return openReview();
      case 'selBtn': return openSel();
      case 'skipRev': S.review.push(S.review.shift()); persist(); return renderReview();
      case 'selSortDiff': S.sel.sort((a, b) => QIDX.get(a).diff - QIDX.get(b).diff || QIDX.get(a).nr - QIDX.get(b).nr || a.localeCompare(b)); persist(); renderMap(true); return renderSel();
      case 'selSortYear': S.sel.sort((a, b) => QIDX.get(a).year - QIDX.get(b).year || QIDX.get(a).nr - QIDX.get(b).nr); persist(); renderMap(true); return renderSel();
      case 'selClear': S.sel = []; persist(); renderHud(); renderMap(true); return renderSel();
      case 'drawerBtn': $('#map').hidden = false; return;
      case 'mapClose': $('#map').hidden = true; return;
    }
  });
  let qTimer = 0;
  $('#fq').addEventListener('input', ev => { clearTimeout(qTimer); qTimer = setTimeout(() => setFilter(f => { f.q = ev.target.value.trim(); }), 180); });
  $('#fFrom').addEventListener('change', ev => setFilter(f => { f.from = +ev.target.value; if (f.to < f.from) f.to = f.from; }));
  $('#fTo').addEventListener('change', ev => setFilter(f => { f.to = +ev.target.value; if (f.from > f.to) f.from = f.to; }));
  document.addEventListener('keydown', ev => {
    if (ev.target.matches('textarea, select') || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (ev.target.matches('input:not([data-num])')) return;
    const active = document.querySelector('.step.active[data-stepkey]');
    if (active && ev.target.matches('input[data-num]')) { if (ev.key === 'Enter') { ev.preventDefault(); check(active.dataset.stepkey); } return; }
    if (ui.view === 'q' && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') && !ev.target.matches('video')) {
      const nb = neighbours(ui.qid), to = ev.key === 'ArrowRight' ? nb.next : nb.prev; if (to) { ev.preventDefault(); openQ(to); } return;
    }
    if (!active) return;
    const nxt = active.querySelector('[data-next]');
    if (ev.key === 'Enter' && nxt && (document.activeElement === document.body || document.activeElement === nxt)) { ev.preventDefault(); return nextStep(active.dataset.stepkey); }
    const abc = active.querySelector('.opts.abc');
    let idx = -1;
    if (/^[1-5]$/.test(ev.key)) idx = +ev.key - 1;
    else if (abc && /^[a-e]$/i.test(ev.key)) idx = 'abcde'.indexOf(ev.key.toLowerCase());
    if (idx >= 0) { const btn = active.querySelectorAll('.opt')[idx]; if (btn && !btn.disabled) { ev.preventDefault(); btn.click(); } }
  });
  window.addEventListener('resize', () => { drawTape(); if (innerWidth > 980) $('#map').hidden = false; });
  new MutationObserver(drawTape).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', drawTape); } catch (e) { /* older browsers */ }

  /* ---------- boot ---------- */
  function start(data) {
    const local = loadLocal(LS); if (local && local.v === 1) S = Object.assign(fresh(), local);
    const lf = loadLocal(LSF); if (lf) F = Object.assign(freshF(), lf);
    $('#brandSub').textContent = `Algebra · runde 1 · ${YEARS[0]}–${YEARS[YEARS.length - 1] + 1} · ${TOTAL} opgaver`;
    if (innerWidth <= 980) $('#map').hidden = true;
    renderFilters();
    const fromHash = (location.hash || '').slice(1);
    const target = (data && data.qid) || (QIDX.has(fromHash) ? fromHash : null) || S.last || (PROBS.find(p => p.anim) || PROBS[0]).id;
    if (data && data.view === 'review') { ui.view = 'review'; renderAll(); }
    else if (data && data.view === 'sel') { ui.view = 'sel'; renderAll(); }
    else openQ(target);
    window.FMTypeset(document.querySelector('.tape-label'));
    drawTape();
    connectDb();
    (async () => {
      try {
        const use = window.claude && window.claude.use ? n => window.claude.use(n) : async () => null;
        sample = await use('sample');
        if (sample) { sampleReady = true; if (ui.view === 'q') renderSteps(); }
      } catch (e) { sample = null; }
    })();
  }
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) { try { window.claude.hot.snapshot(() => ({ view: ui.view, qid: ui.qid })); } catch (e) { /* optional */ } }
  window.claude && window.claude.hot && window.claude.hot.ready ? window.claude.hot.ready(start) : start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
